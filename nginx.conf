server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 32m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://accounts.google.com https://connect.facebook.net; connect-src 'self' https://nominatim.openstreetmap.org https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://graph.facebook.com https://www.facebook.com; frame-src https://accounts.google.com https://www.facebook.com https://staticxx.facebook.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-XSS-Protection "0" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location ^~ /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # ^~ : sans ça, le regex .jpg/.png sert /uploads depuis le frontend (404) au lieu de l’API.
  location ^~ /uploads/ {
    proxy_pass http://backend:8080/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  location /actuator/ {
    deny all;
    return 404;
  }

  location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpe?g|gif|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://accounts.google.com https://connect.facebook.net; connect-src 'self' https://nominatim.openstreetmap.org https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://graph.facebook.com https://www.facebook.com; frame-src https://accounts.google.com https://www.facebook.com https://staticxx.facebook.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
