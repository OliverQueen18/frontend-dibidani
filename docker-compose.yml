# Stack complète lorsque ce dépôt et backend-dibidani-1 sont frères.
# Préférer le compose du dossier parent `dibidani/` (mêmes services).
name: dibidani

services:
  db:
    image: postgres:16-alpine
    container_name: dibidani-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dibidani}
      POSTGRES_USER: ${POSTGRES_USER:-dibidani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - dibidani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dibidani} -d ${POSTGRES_DB:-dibidani}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    networks:
      - data

  backend:
    image: ${BACKEND_IMAGE:-dibidani-backend:local}
    build:
      context: ../backend-dibidani-1
    container_name: dibidani-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dibidani}
      DB_USER: ${POSTGRES_USER:-dibidani}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur Dibidani}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:4200}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      UPLOADS_DIR: /app/uploads
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-true}
      PAYMENT_MOCK_WEBHOOK_SECRET: ${PAYMENT_MOCK_WEBHOOK_SECRET:-}
      ORANGE_MONEY_BASE_URL: ${ORANGE_MONEY_BASE_URL:-https://api.orange.com}
      ORANGE_MONEY_WEBPAY_PATH: ${ORANGE_MONEY_WEBPAY_PATH:-}
      ORANGE_MONEY_CLIENT_ID: ${ORANGE_MONEY_CLIENT_ID:-}
      ORANGE_MONEY_CLIENT_SECRET: ${ORANGE_MONEY_CLIENT_SECRET:-}
      ORANGE_MONEY_MERCHANT_KEY: ${ORANGE_MONEY_MERCHANT_KEY:-}
      MOOV_MONEY_BASE_URL: ${MOOV_MONEY_BASE_URL:-}
      MOOV_MONEY_INITIATE_PATH: ${MOOV_MONEY_INITIATE_PATH:-}
      MOOV_MONEY_MERCHANT_ID: ${MOOV_MONEY_MERCHANT_ID:-}
      MOOV_MONEY_API_KEY: ${MOOV_MONEY_API_KEY:-}
      MOOV_MONEY_WEBHOOK_SECRET: ${MOOV_MONEY_WEBHOOK_SECRET:-}
      SHOP_PHONE: ${SHOP_PHONE:-}
      SHOP_WHATSAPP: ${SHOP_WHATSAPP:-}
      SHOP_FACEBOOK_URL: ${SHOP_FACEBOOK_URL:-https://www.facebook.com/dibidani}
      SHOP_TIKTOK_URL: ${SHOP_TIKTOK_URL:-https://www.tiktok.com/@dibidani}
      SOCIAL_MOCK_ENABLED: ${SOCIAL_MOCK_ENABLED:-true}
      AUTH_OAUTH_MOCK_ENABLED: ${AUTH_OAUTH_MOCK_ENABLED:-true}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PUBLISH_TO: ${WHATSAPP_PUBLISH_TO:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Dibidani}
      MAIL_MOCK_ENABLED: ${MAIL_MOCK_ENABLED:-true}
      SMS_GATEWAY_BASE_URL: ${SMS_GATEWAY_BASE_URL:-https://api.sms-gate.app/3rdparty/v1}
      SMS_GATEWAY_USERNAME: ${SMS_GATEWAY_USERNAME:-}
      SMS_GATEWAY_PASSWORD: ${SMS_GATEWAY_PASSWORD:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      SMS_GATEWAY_DEVICE_ID: ${SMS_GATEWAY_DEVICE_ID:-}
      SMS_GATEWAY_SIM_NUMBER: ${SMS_GATEWAY_SIM_NUMBER:-}
      SMS_GATEWAY_MOCK_ENABLED: ${SMS_GATEWAY_MOCK_ENABLED:-true}
      SHOP_EMAIL: ${SHOP_EMAIL:-}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-}
      SHOP_OPENING_HOURS: ${SHOP_OPENING_HOURS:-}
    volumes:
      - dibidani_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 50s
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - edge
      - data

  frontend:
    image: ${FRONTEND_IMAGE:-dibidani-frontend:local}
    build:
      context: .
    container_name: dibidani-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - edge

volumes:
  dibidani_pgdata:
  dibidani_uploads:

networks:
  edge:
    name: dibidani-edge
    driver: bridge
  data:
    name: dibidani-data
    driver: bridge
    internal: true
